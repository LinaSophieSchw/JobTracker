<!DOCTYPE html>

<!--Versionshistorie Frontend

Version 01 (MG): 
Grundgerüst der Startseite erstellt.

Version 02 – 18.10.2026 (LS):
Linkfeld und Abruf der Titelvorschau ergänzt.
Der erkannte Stellentitel kann im Formular bearbeitet werden.

Version 03 – 20.10.2026 (LS):
Vorschau um Firma, Arbeitsort, Adresse, Pensum und Beschreibung erweitert.
Die Angaben erscheinen in einem bearbeitbaren Formular.
Der geladene Anzeigenlink wird angezeigt; Abbrechen blendet die Vorschau aus.
HTML und JavaScript durch Abschnittskommentare gegliedert.

Version 04 – 20.10.2026 (LS):
Speicherbutton und JavaScript-Methode zur Übermittlung der Formularwerte
an das Backend ergänzt. Ladezustand, Erfolgs- und Fehlermeldungen eingebaut.
Während der Speicherung wird der Speicherbutton gesperrt.

Version 05 – 24.10.2026 (FH):
Nach dem Speichern erscheint die Fahrzeit mit dem Auto in Minuten oder der
Hinweis «Arbeitsweg konnte nicht berechnet werden.» (US 30001).

Version 06 – 24.10.2026 (FH):
Hinter der Fahrzeit erscheint zusätzlich die Strecke in Kilometern (US 30002).
-->
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>JobTracker</title>
    <!-- Vue 3 wird direkt aus dem Internet (CDN) geladen. -->
    <!-- So brauchen wir keine Installation und keine Build-Tools. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<!-- ========================================
     HTML: Seitenaufbau und Formular
     ======================================== -->

<body>
    <div id="app">
        <h1>JobTracker</h1>
        <!-- Backend-Status vorerst ausgeblendet:
        <p>Backend: {{ backend_status }}</p>
        -->
        <h2>Stellenanzeige erfassen</h2>

        <form @submit.prevent="stellenanzeige_laden">
            <label for="stellenlink">Link zur jobs.ch-Stellenanzeige</label>
            <input id="stellenlink" type="url" v-model="stellenlink" required>
            <button type="submit" :disabled="laedt">
                {{ laedt ? "Wird geladen …" : "Informationen laden" }}
            </button>
            <!-- Öffnet das Formular ohne Import. -->
            <button type="button" @click="stellenanzeige_manuell_erfassen" :disabled="laedt || speichert">
                Von Hand erfassen
            </button>
        </form>

        <p v-if="fehlermeldung">{{ fehlermeldung }}</p>
        <!-- Erscheint erst nach einer erfolgreichen Speicherung. -->
        <p v-if="erfolgsmeldung">{{ erfolgsmeldung }}</p>

        <!-- Erscheint erst nach einem erfolgreichen Abruf. -->
        <div v-if="vorschau_vorhanden">
            <h2>Angaben prüfen und bearbeiten</h2>

            <!-- Der geladene Link bleibt unverändert. -->
            <p>
                <!-- Bei manueller Erfassung ist der Link bearbeitbar. -->
            <p v-if="manuelle_erfassung">
                <label for="manueller_link">jobs.ch-Link (Pflichtfeld)</label>
                <input id="manueller_link" type="url" v-model="anzeigenlink">
            </p>

            <!-- Nach einem Import bleibt der normalisierte Link nur lesbar. -->
            <p v-else>
                Geladene Anzeige:
                <a :href="anzeigenlink" target="_blank" rel="noopener noreferrer">
                    {{ anzeigenlink }}
                </a>
            </p>

            <!-- Eine Zeile pro Feld: links Beschriftung, rechts Eingabe. -->
            <table>
                <tbody>
                    <tr>
                        <th scope="row"><label for="stellentitel">Titel</label></th>
                        <td>
                            <input id="stellentitel" type="text" v-model="stellentitel" maxlength="200">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="firma">Firma</label></th>
                        <td>
                            <input id="firma" type="text" v-model="firma" maxlength="200">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="arbeitsort">Arbeitsort</label></th>
                        <td>
                            <input id="arbeitsort" type="text" v-model="arbeitsort" maxlength="200">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">
                            <label for="inseratadresse_strasse">Strasse mit Hausnummer</label>
                        </th>
                        <td>
                            <input id="inseratadresse_strasse" type="text" v-model="inseratadresse_strasse"
                                maxlength="200">
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">
                            <label for="inseratadresse_postleitzahl">Postleitzahl</label>
                        </th>
                        <td>
                            <input id="inseratadresse_postleitzahl" type="text" v-model="inseratadresse_postleitzahl"
                                maxlength="20">
                        </td>
                    </tr>

                    <tr>
                        <th scope="row">
                            <label for="inseratadresse_ort">Adressort</label>
                        </th>
                        <td>
                            <input id="inseratadresse_ort" type="text" v-model="inseratadresse_ort" maxlength="200">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="pensum">Pensum</label></th>
                        <td>
                            <input id="pensum" type="text" v-model="pensum" maxlength="50">
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">
                            <label for="stellenbeschreibung">Stellenbeschreibung</label>
                        </th>
                        <td>
                            <!-- Mehrzeiliges Eingabefeld für den langen Beschreibungstext. -->
                            <textarea id="stellenbeschreibung" v-model="stellenbeschreibung" rows="12"
                                cols="70"></textarea>
                        </td>
                    </tr>
                </tbody>
            </table>

            </table>

            <!-- Speichert die bearbeiteten Angaben. -->
            <button type="button" @click="stellenanzeige_speichern" :disabled="speichert || laedt">
                {{ speichert ? "Wird gespeichert …" : "Speichern" }}
            </button>

            <!-- Blendet die ungespeicherte Vorschau aus. -->
            <button type="button" @click="vorschau_vorhanden = false" :disabled="speichert">
                Abbrechen
            </button>
        </div>

    </div>

    </div>

    <!-- ========================================
     JavaScript: Vue-Daten und Funktionen
     ======================================== -->

    <script>
        // ========================================
        // Vue-Anwendung vorbereiten
        // ========================================
        const { createApp } = Vue;

        createApp({
            // Enthält die Werte für unsere Oberfläche.
            // v-model verbindet die Eingabefelder mit diesen Werten.
            // Beim Bearbeiten aktualisiert Vue den jeweiligen Wert automatisch.

            // ========================================
            // Daten: Formularwerte und Anzeigezustand
            // ========================================
            data() {
                return {
                    backend_status: "wird geprüft …", // Erreichbarkeit des Backends.
                    stellenlink: "",                 // Vom Benutzer eingegebener Link.
                    anzeigenlink: "",                // Tatsächlich geladener, normalisierter Link.

                    // Erkannte Angaben; im Formular manuell korrigierbar.
                    stellentitel: "",                // Titel der Stelle.
                    firma: "",                       // Name des Arbeitgebers.
                    arbeitsort: "",                   // Ein oder mehrere Arbeitsorte.
                    inseratadresse_strasse: "",       // Strasse mit Hausnummer.
                    inseratadresse_postleitzahl: "",  // Postleitzahl als Text.
                    inseratadresse_ort: "",           // Ort der Arbeitsadresse.
                    pensum: "",                      // Beschäftigungsumfang, z. B. „80–100 %“.
                    stellenbeschreibung: "",         // Beschreibung als reiner Text.

                    // Steuern Ladeanzeige, Fehlermeldung und Sichtbarkeit des Formulars.
                    laedt: false,                    // Während des Abrufs ist der Button gesperrt.
                    fehlermeldung: "",               // Meldung bei einem fehlgeschlagenen Abruf.
                    speichert: false,                // Verhindert mehrfaches Klicken während der Speicherung.
                    erfolgsmeldung: "",                 // Zeigt die Bestätigung nach erfolgreicher Speicherung.
                    vorschau_vorhanden: false,        // Zeigt oder verbirgt das gesamte Formular.
                    manuelle_erfassung: false, // Unterscheidet manuelle Neuerfassung von einer importierten Vorschau.
                };
            },
            // Enthält die Funktionen, die unsere Oberfläche auslösen kann.

            // --------------------------------------------------
            // Methoden: Stellenanzeige laden
            // --------------------------------------------------
            methods: {
                // Öffnet das vorhandene Formular ohne Abruf von jobs.ch.
                stellenanzeige_manuell_erfassen() {
                    this.manuelle_erfassung = true;
                    this.fehlermeldung = "";
                    this.erfolgsmeldung = "";

                    // Einen bereits eingegebenen Link behalten wir bei.
                    this.anzeigenlink = this.stellenlink.trim();

                    // Die Angaben werden diesmal von Hand eingegeben.
                    this.stellentitel = "";
                    this.firma = "";
                    this.arbeitsort = "";
                    this.inseratadresse_strasse = "";
                    this.inseratadresse_postleitzahl = "";
                    this.inseratadresse_ort = "";
                    this.pensum = "";
                    this.stellenbeschreibung = "";

                    this.vorschau_vorhanden = true;
                },
                // async erlaubt es, auf die Antwort des Backends zu warten,
                // während der Browser weiterhin bedienbar bleibt.
                async stellenanzeige_laden() {
                    // Sperrt den Ladebutton und blendet die bisherige Vorschau aus.
                    // this greift auf die Werte aus data() zu.
                    // Entfernt die Bestätigung der vorherigen Speicherung.
                    // Ein neuer Import verwendet wieder den Vorschau-Modus.
                    this.manuelle_erfassung = false;
                    this.erfolgsmeldung = "";
                    this.laedt = true;
                    this.fehlermeldung = "";
                    this.vorschau_vorhanden = false;

                    try {
                        // Schickt den eingegebenen Link als JSON an die Flask-Route.
                        // await wartet, bis die Antwort eingetroffen ist.
                        const antwort = await fetch("/api/stellenanzeigen/vorschau", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ url: this.stellenlink }),
                        });

                        // Wandelt die JSON-Antwort in ein JavaScript-Objekt um.
                        const daten = await antwort.json();

                        // Bei einem HTTP-Fehler verwenden wir die Meldung des Backends.
                        // throw springt in den catch-Block weiter unten.
                        if (!antwort.ok) {
                            throw new Error(daten.fehler || "Abruf fehlgeschlagen.");
                        }

                        // Übernimmt die erkannten Angaben in die Formularwerte.
                        // || "" verwendet einen leeren Text, falls eine Angabe fehlt.
                        this.anzeigenlink = daten.url || "";
                        this.stellentitel = daten.titel || "";
                        this.firma = daten.firma || "";
                        this.arbeitsort = daten.arbeitsort || "";
                        this.inseratadresse_strasse = daten.inseratadresse_strasse || "";
                        this.inseratadresse_postleitzahl = daten.inseratadresse_postleitzahl || "";
                        this.inseratadresse_ort = daten.inseratadresse_ort || "";
                        this.pensum = daten.pensum || "";
                        this.stellenbeschreibung = daten.stellenbeschreibung || "";

                        // Zeigt das Formular mit den übernommenen Werten an.
                        // Die Angaben sind bearbeitbar, aber noch nicht gespeichert.
                        this.vorschau_vorhanden = true;
                    } catch (fehler) {
                        // Zeigt Fehler beim Abruf oder Verarbeiten der Antwort an.
                        this.fehlermeldung = fehler.message;
                    } finally {
                        // Läuft bei Erfolg und bei Fehlern: Der Button wird freigegeben.
                        this.laedt = false;
                    }
                },
                // Sendet die aktuell bearbeiteten Formularwerte an die Speicherroute.
                async stellenanzeige_speichern() {
                    this.speichert = true;
                    this.fehlermeldung = "";
                    this.erfolgsmeldung = "";

                    try {
                        const antwort = await fetch("/api/stellenanzeigen", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },

                            // Verwendet die Formularwerte einschliesslich deiner Korrekturen.
                            // Die Benutzer-ID bestimmt das Backend selbst.
                            body: JSON.stringify({
                                url: this.anzeigenlink,
                                titel: this.stellentitel,
                                firma: this.firma,
                                arbeitsort: this.arbeitsort,
                                inseratadresse_strasse: this.inseratadresse_strasse,
                                inseratadresse_postleitzahl: this.inseratadresse_postleitzahl,
                                inseratadresse_ort: this.inseratadresse_ort,
                                pensum: this.pensum,
                                stellenbeschreibung: this.stellenbeschreibung,
                            }),
                        });

                        const daten = await antwort.json();

                        if (!antwort.ok) {
                            throw new Error(daten.fehler || "Speichern fehlgeschlagen.");
                        }

                        // Erst nach erfolgreicher Antwort die Bestätigung anzeigen.
                        this.erfolgsmeldung =
                            `Stellenanzeige gespeichert (ID: ${daten.id}).`;

                        // Fahrzeit und Strecke oder Hinweis an die Bestätigung
                        // anhängen (FH). Das Backend schickt für beide Werte
                        // null, wenn der Arbeitsweg nicht berechnet werden konnte.
                        if (daten.fahrzeit_auto_in_minuten === null) {
                            this.erfolgsmeldung += " Arbeitsweg konnte nicht berechnet werden.";
                        } else {
                            // Die Strecke kommt in Metern, angezeigt wird sie in
                            // Kilometern: 138268 / 1000 = 138.268 → «138.3».
                            // toFixed(1) rundet auf eine Nachkommastelle.
                            const strecke_in_km =
                                (daten.strecke_auto_in_metern / 1000).toFixed(1);
                            this.erfolgsmeldung +=
                                ` Fahrzeit mit dem Auto: ${daten.fahrzeit_auto_in_minuten} Minuten,` +
                                ` Strecke: ${strecke_in_km} km`;
                        }
                        this.vorschau_vorhanden = false;
                    } catch (fehler) {
                        // Bei Fehlern bleibt das Formular mit deinen Eingaben sichtbar.
                        this.fehlermeldung = fehler.message;
                    } finally {
                        // Gibt den Speicherbutton auch nach einem Fehler wieder frei.
                        this.speichert = false;
                    }
                },
            },

            // ========================================
            // Seitenstart: Backend-Verbindung prüfen
            // ========================================
            // mounted() läuft einmal, sobald die Seite geladen ist.
            async mounted() {
                try {
                    const antwort = await fetch("/api/status");
                    const daten = await antwort.json();
                    this.backend_status = daten.status;
                } catch (fehler) {
                    this.backend_status = "nicht erreichbar";
                }
            },
        }).mount("#app");
    </script>
</body>

</html>
